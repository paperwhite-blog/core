name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Unit + golden tests
        run: pnpm test
      - name: Typecheck
        run: |
          pnpm --filter @paperwhite/core exec tsc -p tsconfig.json
          pnpm --filter paperwhite exec tsc -p tsconfig.json
          pnpm --filter example-site exec astro-check --root ../../packages/core --tsconfig ../../packages/core/tsconfig.astro.json

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # git history powers "last updated"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build fixture site
        run: pnpm site:build
      - name: Audit finds exactly the deliberate fixture errors
        run: node scripts/assert-audit.mjs
      - name: Strict mode fails on those errors
        run: |
          if pnpm --filter example-site run build:strict; then echo "strict build should have failed"; exit 1; fi
      - name: Output contract
        run: |
          cd examples/site/dist
          for f in sitemap-index.xml sitemap-en-1.xml sitemap-fa-1.xml rss.xml atom.xml feed.json fa/rss.xml graph.json api/posts.json \
                   robots.txt humans.txt .well-known/security.txt llms.txt _redirects vercel.json nginx-redirects.conf pagefind/pagefind.js \
                   og/posts/hello-world.png 2019/05/old-slug/index.html; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with: { name: site-dist, path: examples/site/dist, retention-days: 7 }

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: site-dist, path: examples/site/dist }
      - run: pnpm exec playwright install --with-deps chromium
      # Linux baselines are generated on first run (macOS baselines are committed separately).
      - run: pnpm exec playwright test --update-snapshots=missing
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright, path: "e2e/__screenshots__\ntest-results", retention-days: 7 }

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: site-dist, path: examples/site/dist }
      - name: Lighthouse ≥ 95 on all categories (mobile)
        run: pnpm lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lighthouse, path: .lighthouseci, retention-days: 7 }

  bench:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Shared 2-vCPU runners are slower than a dev machine; report without blocking merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: 1,000 posts — cold < 60 s, incremental < 10 s
        run: pnpm --filter paperwhite-bench run bench
